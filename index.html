<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wisconsin Lease Reading Tool</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
            line-height: 1.6;
            background: linear-gradient(135deg, #EFF6FF 0%, #E0E7FF 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container { max-width: 900px; margin: 0 auto; }
        .card {
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            padding: 40px;
            margin-bottom: 20px;
        }
        h1 { font-size: 28px; color: #1F2937; margin-bottom: 10px; text-align: center; }
        h2 { font-size: 18px; color: #1F2937; margin-top: 15px; margin-bottom: 8px; font-weight: 700; }
        .subtitle { text-align: center; color: #6B7280; margin-bottom: 30px; }
        .info-box {
            background: #EFF6FF;
            border-left: 4px solid #3B82F6;
            padding: 20px;
            border-radius: 0 8px 8px 0;
            margin-bottom: 30px;
        }
        .info-box h3 { color: #1E40AF; margin-bottom: 10px; font-size: 16px; }
        .info-box li { color: #1E40AF; font-size: 14px; margin: 5px 0; list-style: none; }
        .tabs { display: flex; gap: 10px; margin-bottom: 20px; }
        .tab {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }
        .tab.active { background: #4F46E5; color: white; }
        .tab.inactive { background: #F3F4F6; color: #374151; }
        .tab.inactive:hover { background: #E5E7EB; }
        textarea {
            width: 100%;
            height: 250px;
            padding: 15px;
            border: 2px solid #D1D5DB;
            border-radius: 8px;
            font-family: inherit;
            font-size: 14px;
            resize: vertical;
        }
        textarea:focus { outline: none; border-color: #4F46E5; }
        .btn {
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn-primary { background: #4F46E5; color: white; }
        .btn-primary:hover { background: #4338CA; }
        .btn-primary:disabled { background: #D1D5DB; cursor: not-allowed; }
        .spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid white;
            border-top-color: transparent;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .error-box {
            background: #FEF2F2;
            border-left: 4px solid #EF4444;
            padding: 15px;
            border-radius: 0 8px 8px 0;
            margin: 20px 0;
            color: #991B1B;
        }
        .analysis-content {
            font-size: 15px;
            line-height: 1.7;
            color: #374151;
        }
        .analysis-content h2 {
            font-size: 20px;
            color: #1F2937;
            margin-top: 25px;
            margin-bottom: 12px;
            font-weight: 700;
            padding-bottom: 8px;
            border-bottom: 2px solid #E5E7EB;
        }
        .analysis-content h3 {
            font-size: 18px;
            color: #4B5563;
            margin-top: 20px;
            margin-bottom: 10px;
            font-weight: 600;
        }
        .analysis-content strong {
            color: #1F2937;
            font-weight: 600;
        }
        .analysis-content p {
            margin-bottom: 12px;
        }
        .disclaimer {
            background: #F9FAFB;
            padding: 20px;
            border-radius: 8px;
            margin: 30px 0 20px;
            font-size: 14px;
            color: #6B7280;
        }
        .privacy { text-align: center; margin-top: 30px; font-size: 14px; color: #6B7280; }
    </style>
</head>
<body>
    <div id="app"></div>
    
    <script>
        let state = {
            mode: 'paste',
            text: '',
            analyzing: false,
            result: null,
            error: null
        };

        function render() {
            const app = document.getElementById('app');
            if (state.result) {
                app.innerHTML = renderResult();
            } else {
                app.innerHTML = renderInput();
            }
            attachEventListeners();
        }

        function renderInput() {
            const errorDisplay = state.error ? '<div class="error-box">' + state.error + '</div>' : '';
            const canAnalyze = state.text.trim().length > 50;
            const btnDisabled = !canAnalyze || state.analyzing ? 'disabled' : '';

            return '<div class="container"><div class="card"><h1>Wisconsin Lease Reading Tool</h1><div class="subtitle">Understand your lease and know your rights</div><div class="info-box"><h3>What this tool does:</h3><li>Explains your lease in plain English</li><li>Identifies illegal or unenforceable clauses</li><li>Shows you rights your landlord didn\'t mention</li><li>Suggests questions to ask before signing</li></div><div><label style="display: block; font-weight: 600; margin-bottom: 10px;">Paste your lease text here:</label><textarea id="leaseText" placeholder="Copy and paste your lease text here. Include rent amount, deposit, rules, etc.">' + state.text + '</textarea><div style="font-size: 14px; color: #6B7280; margin-top: 10px;">' + (state.text.length > 0 ? state.text.length + ' characters' : 'Paste lease text above') + '</div></div>' + errorDisplay + '<button class="btn btn-primary" onclick="analyze()" ' + btnDisabled + ' style="margin-top: 20px;">' + (state.analyzing ? '<span class="spinner"></span> Analyzing your lease...' : 'Analyze My Lease') + '</button><div class="privacy"><div>Your privacy matters. Text is analyzed and immediately deleted.</div><div style="margin-top: 5px;">This tool provides educational information, not legal advice.</div></div></div></div>';
        }

        function renderResult() {
            return '<div class="container"><div class="card"><div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px;"><h1 style="text-align: left; margin: 0;">Lease Analysis Report</h1><button class="tab inactive" onclick="resetApp()" style="width: auto; padding: 10px 20px;">New Analysis</button></div><div class="analysis-content">' + state.result + '</div><div class="disclaimer"><div style="margin-bottom: 10px;"><strong>Important:</strong> This tool provides educational information, not legal advice.</div><div><strong>For specific legal questions, contact:</strong></div><div style="margin-top: 5px;">Tenant Resource Center: (608) 257-0006</div><div>Legal Action of Wisconsin: (608) 256-3304</div><div>Report housing problems: https://elam.cityofmadison.com/CitizenAccess/COMLicensesPermits.aspx</div><div>If threatened with eviction, call EDDP immediately</div></div></div></div>';
        }

        function resetApp() {
            state = {
                mode: 'paste',
                text: '',
                analyzing: false,
                result: null,
                error: null
            };
            render();
        }

        function attachEventListeners() {
            const textarea = document.getElementById('leaseText');
            if (textarea) {
                textarea.oninput = function(e) {
                    state.text = e.target.value;
                    render();
                };
            }
        }

        async function analyze() {
            state.analyzing = true;
            state.error = null;
            render();

            try {
                const response = await fetch('/.netlify/functions/anthropicProxy', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        anthropicRequest: {
                            model: 'claude-sonnet-4-20250514',
                            max_tokens: 2000,
                            messages: [{
                                role: 'user',
                                content: 'Analyze this Wisconsin lease. Be CONCISE - use bullet points, short sentences. Focus on what matters most.\n\nFormat:\n\n**RISK LEVEL: [LOW / MODERATE / HIGH / VERY HIGH]**\n[1-2 sentence summary: Is this standard or predatory?]\n\n**BASIC TERMS**\n- Rent: $____ | Due: ____ | Deposit: $____ | Term: ____\n- Late fee: ____ | Utilities: ____\n\n**UNENFORCEABLE (Illegal - you can ignore)**\n[List only if present, with brief note why]\n\n**CONCERNING (Legal but note)**\n[Excessive fees, unfair terms - be specific about amounts]\n\n**YOUR RIGHTS**\n[3-4 key rights not mentioned in lease]\n\n**BOTTOM LINE**\n[2-3 sentences: Main concerns? Standard lease or run? What to prioritize?]\n\nWisconsin law: Non-refundable fees illegal, late fees >5% unenforceable, 24hr entry notice, can\'t waive habitability/notice rights.\n\nEnd with: "Questions? Tenant Resource Center: (608) 257-0006"\n\nLEASE:\n' + state.text
                            }]
                        }
                    })
                });

                const data = await response.json();
                
                console.log('API Response:', data);
                
                if (data.content && data.content[0] && data.content[0].text) {
                    let text = data.content[0].text;
                    
                    // Add styling to RISK LEVEL
                    text = text.replace(/\*\*RISK LEVEL: (LOW|MODERATE|HIGH|VERY HIGH)\*\*/g, function(match, level) {
                        let color = '#10B981'; // green for LOW
                        if (level === 'MODERATE') color = '#F59E0B'; // orange
                        if (level === 'HIGH') color = '#EF4444'; // red
                        if (level === 'VERY HIGH') color = '#DC2626'; // dark red
                        return '<div style="background: ' + color + '; color: white; padding: 15px; border-radius: 8px; font-size: 18px; font-weight: 700; margin: 20px 0;">⚠️ RISK LEVEL: ' + level + '</div>';
                    });
                    
                    // Style section headers
                    text = text.replace(/\*\*BASIC TERMS\*\*/g, '<h2 style="color: #4F46E5;">📋 BASIC TERMS</h2>');
                    text = text.replace(/\*\*UNENFORCEABLE/g, '<h2 style="color: #DC2626;">🚫 UNENFORCEABLE');
                    text = text.replace(/\*\*CONCERNING/g, '<h2 style="color: #F59E0B;">⚠️ CONCERNING');
                    text = text.replace(/\*\*YOUR RIGHTS\*\*/g, '<h2 style="color: #10B981;">✓ YOUR RIGHTS</h2>');
                    text = text.replace(/\*\*BOTTOM LINE\*\*/g, '<h2 style="color: #6366F1;">💡 BOTTOM LINE</h2>');
                    
                    // Convert markdown headers
                    text = text.replace(/### (.*?)(\n|$)/g, '<h3>$1</h3>');
                    text = text.replace(/## (.*?)(\n|$)/g, '<h2>$1</h2>');
                    
                    // Bold text
                    text = text.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
                    
                    // Bullet points with better styling
                    text = text.replace(/^- (.+)$/gm, '<div style="margin: 8px 0 8px 20px; display: flex; gap: 8px;"><span style="color: #4F46E5;">•</span><span>$1</span></div>');
                    
                    // Line breaks
                    text = text.replace(/\n\n/g, '</p><p>');
                    text = text.replace(/\n/g, '<br>');
                    
                    // Wrap in paragraph
                    text = '<p>' + text + '</p>';
                    
                    state.result = text;
                } else if (data.error) {
                    throw new Error('API Error: ' + (data.error.message || 'Unknown error'));
                } else {
                    console.error('Full response:', data);
                    throw new Error('No content in response. Check console for details.');
                }
            } catch (err) {
                console.error('Error:', err);
                state.error = err.message || 'Failed to analyze lease. Please try again.';
            }

            state.analyzing = false;
            render();
        }

        render();
    </script>
</body>
</html>
